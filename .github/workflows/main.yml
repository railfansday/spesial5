name: Scrape & Export Berita

on:
  workflow_dispatch:          # Tombol manual di tab Actions
  schedule:
    - cron: '0 */6 * * *'     # Opsional: jalankan otomatis tiap 6 jam

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install feedparser requests beautifulsoup4 lxml

      # ===== JALANKAN FILE GABUNGAN ANDA =====
      - name: Jalankan Scraper & Export
        run: python importexport.py

      # ===== UPLOAD ARTIFACT (Untuk Berjaga-jaga) =====
      - name: Upload artifact HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-html
          path: |
            *.html
            sitemap.xml
            robots.txt
          retention-days: 3

      # ===== COMMIT & PUSH KE REPO =====
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ambil semua file HTML, sitemap, dan robots
          git add *.html sitemap.xml robots.txt || true
          
          # Jika tidak ada perubahan, berhenti dengan sukses
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          
          # Commit dan Push
          git commit -m "Update otomatis dari GitHub Actions [skip ci]"
          git pull --rebase origin main || true
          git push
